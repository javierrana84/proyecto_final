<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title description">
  <title id="title">Arquitectura de Flight Status</title>
  <desc id="description">Diagrama del despliegue local en Minikube y del flujo CI/CD efímero de GitHub Actions.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#46584d"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#315e83"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #1d2c24; letter-spacing: 0; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #53645a; }
      .section { font-size: 16px; font-weight: 700; }
      .label { font-size: 14px; font-weight: 700; }
      .body { font-size: 12px; fill: #43554a; }
      .small { font-size: 11px; fill: #53645a; }
      .node { stroke-width: 1.5; rx: 8; }
      .flow { stroke: #46584d; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .flow-blue { stroke: #315e83; stroke-width: 2; fill: none; marker-end: url(#arrowBlue); }
      .dashed { stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect width="1440" height="960" fill="#f1f4f0"/>
  <text x="64" y="58" class="title">Arquitectura de Flight Status</text>
  <text x="64" y="85" class="subtitle">Consulta de vuelos, observabilidad y automatización de despliegue</text>

  <rect x="48" y="112" width="1344" height="490" rx="12" fill="#ffffff" stroke="#cbd5ce" stroke-width="1.5"/>
  <text x="72" y="148" class="section">DESPLIEGUE LOCAL · MINIKUBE</text>
  <text x="72" y="171" class="small">Los Pods continúan ejecutándose en el clúster aunque se cierre el port-forward local.</text>

  <rect x="310" y="190" width="770" height="370" rx="12" fill="#f8faf8" stroke="#80958a" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="334" y="219" class="label">Kubernetes · namespace flight-status</text>

  <rect x="72" y="254" width="194" height="96" class="node" fill="#eef3f0" stroke="#6c8174"/>
  <text x="169" y="282" text-anchor="middle" class="label">Navegador</text>
  <text x="169" y="305" text-anchor="middle" class="body">Búsqueda de vuelo</text>
  <text x="169" y="325" text-anchor="middle" class="body">y dashboard</text>

  <rect x="72" y="405" width="194" height="100" class="node" fill="#f5f6f2" stroke="#8d9a91"/>
  <text x="169" y="433" text-anchor="middle" class="label">Script local</text>
  <text x="169" y="455" text-anchor="middle" class="body">Terraform + port-forward</text>
  <text x="169" y="475" text-anchor="middle" class="small">La terminal espera aquí</text>
  <text x="169" y="491" text-anchor="middle" class="small">Ctrl-C cierra los túneles</text>

  <rect x="342" y="262" width="166" height="86" class="node" fill="#e8f2eb" stroke="#39805a"/>
  <text x="425" y="288" text-anchor="middle" class="label">Service app</text>
  <text x="425" y="309" text-anchor="middle" class="body">ClusterIP :80</text>
  <text x="425" y="330" text-anchor="middle" class="small">Ingress flight.local</text>

  <rect x="565" y="248" width="224" height="112" class="node" fill="#e8f2eb" stroke="#39805a"/>
  <text x="677" y="276" text-anchor="middle" class="label">Deployment Flight Status</text>
  <text x="677" y="300" text-anchor="middle" class="body">Flask + Gunicorn</text>
  <text x="677" y="321" text-anchor="middle" class="body">1–3 réplicas · puerto 8080</text>
  <text x="677" y="343" text-anchor="middle" class="small">Imagen: Docker Hub</text>

  <rect x="565" y="391" width="224" height="62" class="node" fill="#fff2e5" stroke="#c27b36"/>
  <text x="677" y="416" text-anchor="middle" class="label">Secret de Kubernetes</text>
  <text x="677" y="437" text-anchor="middle" class="body">AIRLABS_API_KEY</text>

  <rect x="1160" y="248" width="216" height="112" class="node" fill="#fff2e5" stroke="#c27b36"/>
  <text x="1268" y="278" text-anchor="middle" class="label">AirLabs API</text>
  <text x="1268" y="302" text-anchor="middle" class="body">Consulta server-side</text>
  <text x="1268" y="324" text-anchor="middle" class="body">Datos del vuelo</text>
  <text x="1268" y="345" text-anchor="middle" class="small">La clave no llega al navegador</text>

  <rect x="355" y="438" width="190" height="86" class="node" fill="#eaf1f7" stroke="#4c7395"/>
  <text x="450" y="464" text-anchor="middle" class="label">Prometheus</text>
  <text x="450" y="486" text-anchor="middle" class="body">Scrape /metrics · 15 s</text>
  <text x="450" y="506" text-anchor="middle" class="small">Service :9090</text>

  <rect x="827" y="418" width="216" height="106" class="node" fill="#eaf1f7" stroke="#4c7395"/>
  <text x="935" y="447" text-anchor="middle" class="label">Grafana</text>
  <text x="935" y="470" text-anchor="middle" class="body">Dashboard provisionado</text>
  <text x="935" y="492" text-anchor="middle" class="body">Datasource: Prometheus</text>
  <text x="935" y="512" text-anchor="middle" class="small">Service :3000</text>

  <path d="M266 282 H342" class="flow"/>
  <text x="304" y="270" text-anchor="middle" class="small">:8081 local</text>
  <path d="M508 305 H565" class="flow"/>
  <text x="536" y="294" text-anchor="middle" class="small">HTTP</text>
  <path d="M789 304 H1160" class="flow"/>
  <text x="974" y="292" text-anchor="middle" class="small">HTTPS hacia API externa</text>
  <path d="M677 391 V360" class="flow"/>
  <text x="695" y="382" class="small">lee la clave</text>
  <path d="M450 348 V438" class="flow-blue"/>
  <text x="461" y="397" class="small">/metrics</text>
  <path d="M827 475 H545" class="flow-blue"/>
  <text x="686" y="463" text-anchor="middle" class="small">consulta datasource</text>
  <path d="M266 340 C280 410 285 500 320 540 H800 Q827 540 827 524" class="flow-blue dashed"/>
  <text x="654" y="533" text-anchor="middle" class="small">port-forward Grafana :3000</text>
  <path d="M266 455 H294 V535 H310" class="flow dashed"/>
  <text x="292" y="490" text-anchor="middle" class="small">aplica recursos</text>

  <rect x="48" y="632" width="1344" height="276" rx="12" fill="#ffffff" stroke="#cbd5ce" stroke-width="1.5"/>
  <text x="72" y="669" class="section">CI/CD · GITHUB ACTIONS (CLÚSTER EFÍMERO)</text>
  <text x="72" y="692" class="small">Este flujo publica y prueba una imagen; elimina Minikube al finalizar y no mantiene la app en producción.</text>

  <rect x="92" y="744" width="210" height="94" class="node" fill="#eef3f0" stroke="#6c8174"/>
  <text x="197" y="773" text-anchor="middle" class="label">GitHub</text>
  <text x="197" y="796" text-anchor="middle" class="body">Repositorio · push a main</text>
  <text x="197" y="818" text-anchor="middle" class="small">código fuente</text>

  <rect x="365" y="744" width="250" height="94" class="node" fill="#f5f6f2" stroke="#8d9a91"/>
  <text x="490" y="773" text-anchor="middle" class="label">GitHub Actions</text>
  <text x="490" y="796" text-anchor="middle" class="body">Tests · SAST · pip-audit</text>
  <text x="490" y="818" text-anchor="middle" class="small">Build · Terraform</text>

  <rect x="680" y="744" width="200" height="94" class="node" fill="#e8f2eb" stroke="#39805a"/>
  <text x="780" y="773" text-anchor="middle" class="label">GHCR</text>
  <text x="780" y="796" text-anchor="middle" class="body">Imagen por commit SHA</text>
  <text x="780" y="818" text-anchor="middle" class="small">registro de contenedores</text>

  <rect x="945" y="744" width="190" height="94" class="node" fill="#f5f6f2" stroke="#8d9a91"/>
  <text x="1040" y="773" text-anchor="middle" class="label">Minikube CI</text>
  <text x="1040" y="796" text-anchor="middle" class="body">Despliegue temporal</text>
  <text x="1040" y="818" text-anchor="middle" class="small">Terraform + app</text>

  <rect x="1195" y="744" width="150" height="94" class="node" fill="#fff2e5" stroke="#c27b36"/>
  <text x="1270" y="773" text-anchor="middle" class="label">ZAP</text>
  <text x="1270" y="796" text-anchor="middle" class="body">DAST baseline</text>
  <text x="1270" y="818" text-anchor="middle" class="small">JSON artifact</text>

  <path d="M302 791 H365" class="flow"/>
  <path d="M615 791 H680" class="flow"/>
  <path d="M880 791 H945" class="flow"/>
  <path d="M1135 791 H1195" class="flow"/>
  <text x="720" y="873" text-anchor="middle" class="small">Al terminar DAST, el workflow ejecuta minikube delete.</text>

  <text x="72" y="936" class="small">Flujos azules: métricas y observabilidad · Flujos grises: solicitudes, aprovisionamiento y pipeline</text>
</svg>
